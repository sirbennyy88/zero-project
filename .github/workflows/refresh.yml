name: Weekly refresh & publish

on:
  schedule:
    - cron: "15 9 * * 1"      # every Monday 09:15 UTC (05:15 Toronto)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["zeroweek-data.*", "feed.xml", "data-src/cache/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull every source and rebuild data files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python data-src/refresh.py
      - name: Commit refreshed data
        run: |
          git config user.name "zero-project-bot"
          git config user.email "actions@users.noreply.github.com"
          git add zeroweek-data.js zeroweek-data.json zeroweek-data.csv feed.xml data-src/cache/*.json
          git diff --cached --quiet || git commit -m "data: weekly refresh $(date -u +%F)"
          git push
      - name: Sync to Cloudflare D1
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 --version
          python cloudflare/load_d1.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
